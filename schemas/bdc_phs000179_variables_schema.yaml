enums:
  ConsentEnum:
    permissible_values:
      ? Subjects did not participate in the study, did not complete a consent document
        and are included only for the pedigree structure and/or genotype controls,
        such as HapMap subjects
      : annotations:
          code: '0'
      Health/Medical/Biomedical (HMB):
        annotations:
          code: '1'
      Disease-Specific (COPD and Smoking) (DS-CS):
        annotations:
          code: '2'
  SexEnum:
    permissible_values:
      Male:
        annotations:
          code: '1'
      Female:
        annotations:
          code: '2'
  ShorttermFlagEnum:
    permissible_values:
      Main Phase visit:
        annotations:
          code: '0'
      Short-term 1-year follow-up visit:
        annotations:
          code: '1'
  PhaseStudyEnum:
    permissible_values:
      Phase 1 2007-2011:
        annotations:
          code: P1
      Phase 2 2013-2017:
        annotations:
          code: P2
      Phase 3 2018-2023:
        annotations:
          code: P3
      Phase 3 Short-term 1-year follow-up 2019-2020:
        annotations:
          code: P3B
  CohortEnum:
    permissible_values:
      Interstitial lung disease/Bronchiectasis:
        annotations:
          code: ILD/Brnch
      Never smoked:
      Smoker:
  RaceEnum:
    permissible_values:
      White:
        annotations:
          code: '1'
      Black or African American:
        annotations:
          code: '2'
      Asian:
        annotations:
          code: '3'
      Pacific Islander:
        annotations:
          code: '4'
      American Indian / Alaska Native:
        annotations:
          code: '5'
      More than one race:
        annotations:
          code: '6'
      Other:
        annotations:
          code: '7'
  EthnicEnum:
    permissible_values:
      Hispanic or Latino:
        annotations:
          code: '1'
      Not Hispanic or Latino:
        annotations:
          code: '2'
  MaritalstatusEnum:
    permissible_values:
      Married:
        annotations:
          code: '1'
      Divorced:
        annotations:
          code: '2'
      Widowed:
        annotations:
          code: '3'
      Separated:
        annotations:
          code: '4'
      Never married:
        annotations:
          code: '5'
      member of unmarried couple:
        annotations:
          code: '6'
  EversmokedcigEnum:
    permissible_values:
      'No':
        annotations:
          code: '0'
      'Yes':
        annotations:
          code: '1'
  SmokingStatusEnum:
    permissible_values:
      Never-smoked:
        annotations:
          code: '0'
      Former smoker:
        annotations:
          code: '1'
      Current smoker:
        annotations:
          code: '2'
  ExclusionarydiseaseEnum:
    permissible_values:
      Bronchiectasis:
      ILD:
  FinalgoldBaselineEnum:
    permissible_values:
      NeverSmoked Normal Lung Function (FEV1 >= 80% & FEV1/FVC >= 0.7):
        annotations:
          code: '-2'
      PRISm (Preserved Ratio Impaired Spirometry (FEV1/FVC >= 0.7 but FEV1< 80%):
        annotations:
          code: '-1'
      GOLD 0 Control (FEV1 >= 80% & FEV1/FVC >= 0.7):
        annotations:
          code: '0'
      GOLD 1 (FEV1 >= 80% & FEV1/FVC < 0.7):
        annotations:
          code: '1'
      GOLD 2 (50% <= FEV1 < 80% & FEV1/FVC < 0.7):
        annotations:
          code: '2'
      GOLD 3 (30% <= FEV1 < 50% & FEV1/FVC < 0.7):
        annotations:
          code: '3'
      GOLD 4 (FEV1 < 30% & FEV1/FVC < 0.7):
        annotations:
          code: '4'
  Subgroup2019Enum:
    permissible_values:
      Exposure:
        annotations:
          code: A
      Expos + Abn CT:
        annotations:
          code: B
      Expos + Sympt:
        annotations:
          code: C
      Expos + Abn Spiro:
        annotations:
          code: D
      Expos + Sympt + Abn CT:
        annotations:
          code: E
      Expos + Abn Spiro + Sympt:
        annotations:
          code: F
      Expos + Abn Spiro + Abn CT:
        annotations:
          code: G
      Expos + Abn Spiro + Sympt + Abn CT:
